services:
  homelab-mcp:
    build: .
    container_name: homelab-mcp
    restart: unless-stopped
    environment:
      - UNIFI_HOST=${UNIFI_HOST}
      - UNIFI_API_KEY=${UNIFI_API_KEY}
      - UNIFI_SITE_ID=${UNIFI_SITE_ID:-default}
      - UNIFI_VERIFY_SSL=${UNIFI_VERIFY_SSL:-false}
      - HA_URL=${HA_URL:-}
      - HA_TOKEN=${HA_TOKEN:-}
      - PIHOLE_HOSTS=${PIHOLE_HOSTS:-}
      - PIHOLE_PASSWORD=${PIHOLE_PASSWORD:-}
      - PIHOLE_PASSWORD_PIHOLE1=${PIHOLE_PASSWORD_PIHOLE1:-}
      - PIHOLE_PASSWORD_PIHOLE2=${PIHOLE_PASSWORD_PIHOLE2:-}
    ports:
      # Alleen bereikbaar binnen je LAN/VPN — publiceer deze poort NOOIT
      # rechtstreeks naar het internet.
      - "8001:8000"
